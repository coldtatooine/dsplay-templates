<!doctype html>
<html>

<head>
  <title>DSPLAY - Skitter Slider</title>
  <meta charset="utf-8">
  <link rel="shortcut icon" type="image/png" href="images/favicon.png">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/skitter.css">
</head>

<body>
  <div class="skitter-large-box">
    <div id="root" class="skitter skitter-large">
      <ul></ul>
    </div>
  </div>
  <div id="overlay" role="status">
    <div class="loader">
      <div class="loader__frame" aria-hidden="true">
        <div class="loader__strip">
          <div class="loader__slide loader__slide--sky"><span class="loader__sun"></span></div>
          <div class="loader__slide loader__slide--dusk"><span class="loader__sun"></span></div>
          <div class="loader__slide loader__slide--grass"><span class="loader__sun"></span></div>
          <div class="loader__slide loader__slide--sky"><span class="loader__sun"></span></div>
        </div>
      </div>
      <div class="loader__dots" aria-hidden="true"><span class="loader__dot loader__dot--a"></span><span class="loader__dot loader__dot--b"></span><span class="loader__dot loader__dot--c"></span></div>
      <div class="loader__text"><span id="loadingText"></span></div>
    </div>
  </div>
  <!-- import core-js (try to use the latest version) -->
  <script src="scripts/core-js-3.50.0.js"></script>
  <!-- import dsplay-data.js -->
  <script src="scripts/dsplay-data.js"></script>
  <!-- import dsplay-template-utils. (get the latest version from https://unpkg.com/@dsplay/template-utils) -->
  <script src="scripts/dsplay-template-utils.js"></script>
  <!-- import jQuery (try to use the latest version) -->
  <script src="scripts/jquery-3.6.1.min.js"></script>
  <script src="scripts/jquery.easing.min.js"></script>
  <script src="scripts/jquery.skitter.min.js"></script>
  <!-- import your main script file after -->
  <script src="scripts/app.js"></script>
</body>

</html>
