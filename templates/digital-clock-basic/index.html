<!doctype html>
<html>

<head>
  <title>DSPLAY - Digital Clock</title>
  <meta charset="utf-8">
  <meta name="viewport"
    content="height=device-height, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="format-detection" content="email=no" />
  <link rel="shortcut icon" type="image/png" href="assets/image/favicon.png">
  <link rel="stylesheet" href="styles/main.css">
</head>

<body>
  <div id="mainDiv">
    <div id="wrapper">
      <div id="bar"></div>

      <div id="infoContainer">
        <div id="dateDiv">
          <span id="date"></span>
        </div>
        <div id="timeDiv">
          <span id="time"></span>
        </div>
      </div>
    </div>
  </div>
  <!-- the loader: the template's own bar and digits, ticking, with the word in the language of the screen (filled by app.js) -->
  <div id="overlay" role="status">
    <div class="loader">
      <div class="loader__bar"></div>
      <div class="loader__info">
        <div class="loader__label"><span id="loadingText"></span></div>
        <div class="loader__time" aria-hidden="true">
          <span class="loader__digit">0</span><span class="loader__digit">0</span><span class="loader__colon">:</span><span class="loader__digit">0</span><span class="loader__digit">0</span><span class="loader__colon">:</span><span class="loader__digit">0</span><span class="loader__digit loader__reel"><span class="loader__strip"><span class="loader__number">0</span><span class="loader__number">1</span><span class="loader__number">2</span><span class="loader__number">3</span><span class="loader__number">4</span><span class="loader__number">5</span><span class="loader__number">6</span><span class="loader__number">7</span><span class="loader__number">8</span><span class="loader__number">9</span></span></span>
        </div>
      </div>
    </div>
  </div>
  <!-- import core-js (try to use the latest version) -->
  <script src="scripts/core-js-3.50.0.js"></script>
  <!-- import dsplay-data.js -->
  <script src="scripts/dsplay-data.js"></script>
  <!-- import dsplay-template-utils. (get the latest version from https://unpkg.com/@dsplay/template-utils) -->
  <script src="scripts/dsplay-template-utils.js"></script>
  <!-- import jQuery (try to use the latest version) -->
  <script src="scripts/jquery-4.0.0.min.js"></script>
  <!-- import your main script file after -->
  <script src="scripts/app.js"></script>
</body>

</html>
