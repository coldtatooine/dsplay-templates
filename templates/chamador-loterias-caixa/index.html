<!doctype html>
<html>

<head>
  <title>DSPLAY - Chamador Loterias Caixa</title>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="format-detection" content="email=no" />
  <link rel="shortcut icon" type="image/png" href="assets/image/favicon.png">
  <link rel="stylesheet" href="styles/main.css">
</head>

<body>
  <div id="mainDiv">

    <div id="senha">CAIXA LIVRE</div>
    <div id="numero"></div>
    <audio src="assets/audio/bell-01.mp3" autoplay></audio>
  </div>
  <!-- the loader: the template's own big yellow number counting on its blue background, with the word in the language of the screen (filled by app.js) -->
  <div id="overlay" role="status">
    <div class="loader">
      <div class="loader__label"><span id="loadingText"></span></div>
      <div class="loader__digits" aria-hidden="true"><span class="loader__digit"><span class="loader__strip loader__strip--tens"><span class="loader__number">0</span><span class="loader__number">1</span><span class="loader__number">2</span><span class="loader__number">3</span><span class="loader__number">4</span><span class="loader__number">5</span><span class="loader__number">6</span><span class="loader__number">7</span><span class="loader__number">8</span><span class="loader__number">9</span></span></span><span class="loader__digit"><span class="loader__strip"><span class="loader__number">0</span><span class="loader__number">1</span><span class="loader__number">2</span><span class="loader__number">3</span><span class="loader__number">4</span><span class="loader__number">5</span><span class="loader__number">6</span><span class="loader__number">7</span><span class="loader__number">8</span><span class="loader__number">9</span></span></span></div>
    </div>
  </div>
  <!-- import core-js (try to use the latest version) -->
  <script src="scripts/core-js-3.50.0.js"></script>
  <!-- import dsplay-data.js -->
  <script src="scripts/dsplay-data.js"></script>
  <!-- import dsplay-template-utils. (get the latest version from https://unpkg.com/@dsplay/template-utils) -->
  <script src="scripts/dsplay-template-utils.js"></script>
  <!-- import your main script file after -->
  <script src="scripts/app.js"></script>
</body>

</html>
